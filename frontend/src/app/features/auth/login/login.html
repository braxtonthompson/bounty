<h1>Sign In</h1>
<form [formGroup]="loginForm">
    <label for="login-email">Email</label>
    <input formControlName="email" id="login-email" />
    <label for="login-email">Password</label>
    <input formControlName="password" id="login-password" />
    <button type="submit" (click)="onClick()">Sign In</button>
</form>
